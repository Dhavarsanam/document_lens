org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# ✅ Force Gradle/Kotlin to use a JDK 21 JBR, not whatever JDK is first on
# PATH/JAVA_HOME. The Program Files Android Studio's JBR auto-updated to
# Java 25.0.2, and the Kotlin compiler bundled with this AGP/Gradle version
# can't parse that version string ("java.lang.IllegalArgumentException:
# 25.0.2" in JavaVersion.parse) — a known Kotlin-compiler limitation with
# very new JDK releases. Pointing at the second Android Studio install's
# JBR instead, which is still on Java 21.0.9.
org.gradle.java.home=C:/(E) Folder/AndroidStudio/jbr
android.useAndroidX=true
# Some third-party plugins (e.g. tesseract_ocr) compile Java at 1.8 while
# Kotlin follows the JDK (21). That mismatch fails release builds with
# "Inconsistent JVM-target compatibility". We can't edit those plugins, so
# downgrade the check from error to warning — the APK still builds/runs fine.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false